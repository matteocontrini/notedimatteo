name: Build

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm install
      - name: Set up environment
        run: cp .env.example .env
      - name: Lint
        run: npm run lint
      - name: Run Svelte checks
        run: npm run check

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      - name: Build assets
        run: npm run go:assets
      - name: Point pkg-config at the libvips in node_modules
        run: npm run go:libvips && echo "PKG_CONFIG_LIBDIR=$PWD/.libvips" >> "$GITHUB_ENV"
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal web)" && go tool templ fmt -fail internal/views
      - name: Check generated templ files are up to date
        run: go tool templ generate && test -z "$(git status --porcelain internal/views)"
      - name: Check generated sqlc files are up to date
        run: go tool sqlc diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test image processing in the Docker image
        run: docker build --target libvips-test .
      - name: Build the Docker image
        run: docker build .
