name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Install npm dependencies
        run: npm ci
      - name: Check formatting, lint, types, and vet
        run: npm run check
      # npm run check regenerates the templ and sqlc code
      - name: Check generated files are committed
        run: git status --porcelain && test -z "$(git status --porcelain)"

  test:
    runs-on: ubuntu-latest
    # Runs each part of npm test in parallel
    strategy:
      fail-fast: false
      matrix:
        script: ['test:js', 'test:go', 'test:e2e']
    name: '${{ matrix.script }}'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        if: matrix.script == 'test:e2e'
        run: npx playwright install --with-deps chromium
      # The Go and browser tests start Postgres and rclone's S3 server with
      # testcontainers, through the runner's Docker
      - name: Run tests
        run: npm run ${{ matrix.script }}
      - name: Upload Playwright report
        if: failure() && matrix.script == 'test:e2e'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test image processing in the Docker image
        run: docker build --target libvips-test .
      - name: Build the Docker image
        run: docker build .

  # Fails when actions.lock is out of sync with the workflows or a locked commit no longer verifies upstream
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify
