name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install npm dependencies
        run: npm ci
      - name: Check formatting, lint, types, and vet
        run: npm run check
      # npm run check regenerates the templ and sqlc code
      - name: Check generated files are committed
        run: git status --porcelain && test -z "$(git status --porcelain)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The Go and browser tests start Postgres and rclone's S3 server with
      # testcontainers, through the runner's Docker
      - name: Run tests
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test image processing in the Docker image
        run: docker build --target libvips-test .
      - name: Build the Docker image
        run: docker build .
