version: '2'
sql:
  - engine: postgresql
    # sqlc applies the goose migrations' Up sections in order to learn the schema
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        initialisms: [id, html, url]
        output_db_file_name: sqlc.go
        output_models_file_name: sqlc_models.go
        # Use int and time.Time instead of sqlc's default int32 and pgtype.Timestamptz.
        # Each type is listed twice: once for required columns, once for nullable ones.
        overrides:
          - db_type: serial
            go_type: int
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
